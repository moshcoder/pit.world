name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The crawler's frontier and queues are tested against a real Redis.
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      CRAWL_TEST_REDIS: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit -p services/crawler

  # A private search engine is held to the strictest gate: nothing at medium or
  # above, dependencies included.
  threatcrush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g --ignore-scripts @profullstack/threatcrush@0.13.32
      - run: threatcrush scan . --deps --fail-on critical,high,medium
