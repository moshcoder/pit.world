# Ship every merge to dev2, where pit.world runs as root from /opt/pit.world.
# PIT_DEPLOY_KEY is a root key restricted on dev2 to one forced command,
# /usr/local/bin/pit-world-deploy, which takes a commit already on origin/main,
# fast-forwards the checkout to it and runs bin/install.sh. It can do nothing else.
name: Deploy to dev2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.PIT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PIT_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # The secret is pasted by hand: accept the PEM block however a terminal copy
          # mangled it (indented, CRLF, lines joined), or the whole file as one base64 line.
          flat=$(printf '%s' "$SSH_KEY" | tr -d ' \t\r\n')
          case "$flat" in
            *-----BEGINOPENSSHPRIVATEKEY-----*)
              body=${flat#*-----BEGINOPENSSHPRIVATEKEY-----}
              body=${body%%-----ENDOPENSSHPRIVATEKEY-----*}
              # threatcrush-disable-next-line secret-private-key  rebuilds the PIT_DEPLOY_KEY secret's armour at run time; no key material is committed
              { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s\n' "$body" | fold -w 70; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/id_ed25519 ;;
            *) printf '%s' "$flat" | base64 -d > ~/.ssh/id_ed25519 ;;
          esac
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "PIT_DEPLOY_KEY is not a usable private key"; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 root@dev2.profullstack.com "deploy $SHA"

      - name: Verify the site answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://pit.world/health || true)
            if [ "$code" = 200 ]; then echo "pit.world $code"; break; fi
            echo "attempt $i: $code"; sleep 10
          done
          [ "$code" = 200 ] || { echo "pit.world never answered"; exit 1; }

      - name: Verify Daily Stitcher TLS, page, and sign-in route
        run: |
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 https://daily.stitcher.pit.world/health || true)
            if [ "$code" = 200 ]; then break; fi
            echo "Daily Stitcher health attempt $i: $code"; sleep 10
          done
          [ "$code" = 200 ] || { echo "Daily Stitcher HTTPS health check failed"; exit 1; }
          curl -fsS --connect-timeout 5 --max-time 10 https://daily.stitcher.pit.world/ -o /tmp/daily-stitcher.html
          grep -q 'A home for handmade quilts and the stories behind the stitches.' /tmp/daily-stitcher.html
          location=$(curl -sS -D - -o /dev/null --connect-timeout 5 --max-time 10 https://daily.stitcher.pit.world/owner/signin | awk '/^[Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn]:/ {sub(/\r$/, ""); print $2}')
          case "$location" in https://pit.world/bridge/authorize\?*) echo "Daily Stitcher owner sign-in reaches the pit.world CoinPay bridge" ;; *) echo "Daily Stitcher owner sign-in did not reach the pit.world bridge"; exit 1 ;; esac
          code=$(curl -sS -o /tmp/daily-stitcher-auth.json -w '%{http_code}' --connect-timeout 5 --max-time 10 https://daily.stitcher.pit.world/api/owner/status)
          [ "$code" = 401 ] && grep -q 'sign_in_required' /tmp/daily-stitcher-auth.json || { echo "Daily Stitcher owner API did not require sign-in"; exit 1; }
