# <name>.pit.world: pit.world's relay of every Moshpit name to the old internet (src/proxy.ts).
# Installed as /etc/nginx/sites-available/pit-proxy (symlinked into sites-enabled).
#
# DNS: one wildcard, *.pit.world -> dev2. TLS: a wildcard certificate covers a single
# label and these hosts have two or more (family.ancestry.pit.world), so every name has
# its own Let's Encrypt certificate under /etc/letsencrypt/live/<host>/, chosen here by
# SNI. /usr/local/bin/pit-proxy-cert makes one; the app asks for it on a name's first
# plain-http visit. pit.world and www.pit.world have their own exact server blocks,
# which nginx prefers over this regex.

server {
    listen 80;
    listen [::]:80;
    server_name ~^[a-z0-9-]+(\.[a-z0-9-]+)+\.pit\.world$;
    access_log off;
    error_log /var/log/nginx/pit-proxy.error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/pit-acme;
    }
    # The app redirects to https when the certificate exists, and asks for one when it does not.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^[a-z0-9-]+(\.[a-z0-9-]+)+\.pit\.world$;

    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;

    access_log off;
    error_log /var/log/nginx/pit-proxy.error.log crit;
    client_max_body_size 30m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
