# pitbot on one box: the crawler, pit.world's own Redis (never a shared one),
# and Obscura browser servers for JavaScript pages. Nothing listens beyond
# loopback; the crawler cannot reach the host's own services (bridge network,
# and every address is checked against private ranges before a request).
#
#   cd ~/www/pit-crawler && docker compose -f app/deploy/crawler/docker-compose.yml --env-file crawler.env -p pit-crawler up -d --build
#
# Health: curl 127.0.0.1:8807/healthz on the host.
# Scale: `--scale crawler=N` on this box, or the same image on another box with
# CRAWL_REDIS_URL pointed here. More JavaScript rendering: add obscura-N and
# list it in OBSCURA_MCP_URLS.
#
# The site frontier (every known site, parked or scheduled) is in Postgres: pit.world's
# own Supabase, pit-world-supabase (cli-tools `dev2-site supabase-stack pit.world`),
# role pitcrawl, CRAWL_DATABASE_URL in crawler.env. crawler and pages join that stack's
# network to reach pit-world-supabase-db; it must exist before `up`.
name: pit-crawler

services:
  redis:
    image: redis:8-alpine
    # 4 GB: remote page workers (deploy/crawler-remote) raise the page backlog toward 600k jobs.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '4gb', '--maxmemory-policy', 'noeviction']
    volumes: ['redis:/data']
    ports: ['127.0.0.1:6396:6379']
    mem_limit: 5g
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s

  obscura-1: &obscura
    image: h4ckf0r0day/obscura
    command: ['mcp', '--http', '--host', '0.0.0.0', '--port', '3000', '--user-agent', 'Mozilla/5.0 (compatible; pitbot/0.1; +https://pit.world/bot)']
    environment:
      OBSCURA_MCP_TOKEN: ${OBSCURA_MCP_TOKEN:?set OBSCURA_MCP_TOKEN in crawler.env}
    # 1g was OOM-killed every 10-20 min (2026-11-08); a browser on heavy pages wants room.
    mem_limit: 8g
    restart: unless-stopped

  obscura-2: *obscura

  crawler:
    build:
      context: ../..
      dockerfile: services/crawler/Dockerfile
    image: pit-crawler:latest
    env_file: ${CRAWLER_ENV:-../../../crawler.env}
    environment:
      CRAWL_REDIS_URL: redis://redis:6379
      CRAWL_HEALTH_HOST: 0.0.0.0
      # The publish role (index, archive, API pit.world reads) may live on another box:
      # deploy/crawler-remote. Then crawler.env sets PIT_CRAWLER_ROLES=site,page,render.
      CRAWL_ROLES: ${PIT_CRAWLER_ROLES:-site,page,render,publish}
      OBSCURA_MCP_URLS: http://obscura-1:3000/mcp,http://obscura-2:3000/mcp
    depends_on:
      redis: { condition: service_healthy }
      obscura-1: { condition: service_started }
      obscura-2: { condition: service_started }
    ports: ['127.0.0.1:8807:8797']
    networks: [default, frontier]
    # The local search mirror pit.world reads (/api/v1/search on 8807).
    volumes: ['index:/data']
    mem_limit: 1536m
    restart: unless-stopped
    stop_grace_period: 30s

  # Fetch-only workers: more of them read more pages at once (each still one request
  # per site at a time). PIT_PAGE_WORKERS in crawler.env sets how many.
  pages:
    image: pit-crawler:latest
    env_file: ${CRAWLER_ENV:-../../../crawler.env}
    environment:
      CRAWL_REDIS_URL: redis://redis:6379
      CRAWL_ROLES: page
      CRAWL_HEALTH_HOST: 0.0.0.0
    networks: [default, frontier]
    depends_on:
      redis: { condition: service_healthy }
      crawler: { condition: service_started }
    deploy:
      replicas: ${PIT_PAGE_WORKERS:-2}
    mem_limit: 768m
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  redis:
  index:

networks:
  default: {}
  frontier:
    external: true
    name: pit-world-supabase_default
