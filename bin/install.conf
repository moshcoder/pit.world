# bin/install.sh settings for pit.world (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: provider keys go in $STATE_DIR/app.env, written from the
# logicsrc vault profullstack/pit-world--prod.
APP=pit-world
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8787
HEALTH_PATH=/health
DOMAINS=pit.world www.pit.world
TLS=1
TLS_EMAIL=anthony@profullstack.com
MAX_BODY=64k
ACCESS_LOG=off
